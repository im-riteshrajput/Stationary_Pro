            <div class="card">
                <div class="inventory-table-container">
                    <table class="inventory-table">
                        <thead>
                            <tr>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Location</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody">
                            <!-- Items will be populated here -->
                        </tbody>

    <!-- Add/Edit Item Modal -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Item</h2>
                <button class="modal-close" onclick="closeItemModal()">&times;</button>
            </div>

            <form id="itemForm">
                <input type="hidden" id="itemId" name="id">

                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" name="name" required>
                </div>

                <div class="form-group">
                    <label for="itemCategory">Category</label>
                    <select id="itemCategory" name="category" required>
                        <option value="">Select Category</option>
                        <option value="Writing">Writing</option>
                        <option value="Paper">Paper</option>
                        <option value="Office Supplies">Office Supplies</option>
                        <option value="Art Supplies">Art Supplies</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="itemQuantity">Quantity</label>
                        <input type="number" id="itemQuantity" name="quantity" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="itemMinStock">Minimum Stock</label>
                        <input type="number" id="itemMinStock" name="minStock" min="1" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="itemRow">Row</label>
                        <input type="text" id="itemRow" name="row" required>
                    </div>

                    <div class="form-group">
                        <label for="itemColumn">Column</label>
                        <input type="text" id="itemColumn" name="column" required>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeItemModal()">Cancel</button>
                    <button type="submit" class="btn-primary" id="submitItem">Save Item</button>
                </div>
            </form>
        </div>
