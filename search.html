<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Items - StationeryPro</title>
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-box"></i>
                    <span class="logo-text">StationeryPro</span>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="inventory.html" class="nav-link">
                        <i class="fas fa-boxes"></i>
                        <span>Inventory</span>
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="search.html" class="nav-link">
                        <i class="fas fa-search"></i>
                        <span>Search Items</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="receipts.html" class="nav-link">
                        <i class="fas fa-receipt"></i>
                        <span>Receipts</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="alerts.html" class="nav-link">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>Low Stock Alerts</span>
                    </a>
                </li>
            </ul>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <span class="username">Admin User</span>
                    <span class="email">admin@stationery.com</span>
                </div>
                <button id="logout" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sign Out</span>
                </button>
            </div>
        </nav>
        
        <main class="main-content">
            <header class="page-header">
                <div class="page-title">
                    <h1>Search Items</h1>
                    <p>Find items quickly by name, category, or location</p>
                </div>
            </header>
            
            <div class="search-container">
                <div class="search-form">
                    <div class="search-input-group">
                        <i class="fas fa-search"></i>
                        <input type="text" id="mainSearch" placeholder="Search by item name, category, or location...">
                        <button type="button" id="clearSearch" class="clear-btn" style="display: none;">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <div class="advanced-search" id="advancedSearch" style="display: none;">
                        <div class="search-filters">
                            <div class="filter-group">
                                <label for="searchCategory">Category</label>
                                <select id="searchCategory">
                                    <option value="">All Categories</option>
                                    <option value="Writing">Writing</option>
                                    <option value="Paper">Paper</option>
                                    <option value="Office Supplies">Office Supplies</option>
                                    <option value="Art Supplies">Art Supplies</option>
                                </select>
                            </div>
                            
                            <div class="filter-group">
                                <label for="searchRow">Row</label>
                                <input type="text" id="searchRow" placeholder="e.g., A, B, C...">
                            </div>
                            
                            <div class="filter-group">
                                <label for="searchColumn">Column</label>
                                <input type="text" id="searchColumn" placeholder="e.g., 1, 2, 3...">
                            </div>
                            
                            <div class="filter-group">
                                <label for="searchStatus">Stock Status</label>
                                <select id="searchStatus">
                                    <option value="">All Status</option>
                                    <option value="good">In Stock</option>
                                    <option value="low">Low Stock</option>
                                    <option value="out">Out of Stock</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="search-actions">
                        <button type="button" id="toggleAdvanced" class="btn-secondary">
                            <i class="fas fa-sliders-h"></i>
                            Advanced Search
                        </button>
                        <button type="button" id="resetFilters" class="btn-secondary">
                            <i class="fas fa-undo"></i>
                            Reset
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="search-results">
                <div class="results-header">
                    <h3 id="resultsCount">Search results will appear here</h3>
                    <div class="view-options">
                        <button class="view-btn active" data-view="grid">
                            <i class="fas fa-th"></i>
                        </button>
                        <button class="view-btn" data-view="list">
                            <i class="fas fa-list"></i>
                        </button>
                    </div>
                </div>
                
                <div id="searchResults" class="results-container grid-view">
                    <!-- Search results will be populated here -->
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/common.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
